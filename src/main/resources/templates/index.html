<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>智能语音外呼 · 任务看板</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M6.6 3.8 4.2 4.9c-1 .5-1.5 1.6-1.2 2.7 1.6 6.7 7 12.1 13.7 13.7 1.1.3 2.2-.2 2.7-1.2l1.1-2.4-4.1-1.9-1.4 1.5c-2.6-1.2-4.7-3.3-5.9-5.9l1.5-1.4z"/>
            </svg>
        </span>
        <div class="brand-text">
            <h1>智能语音外呼</h1>
            <p>任务看板</p>
        </div>
    </div>
    <div class="topbar-actions">
        <span class="updated" id="updatedAt">正在加载…</span>
        <button class="btn btn-ghost" id="refreshBtn" type="button">刷新</button>
        <button class="btn btn-primary" id="newTaskBtn" type="button">
            <span aria-hidden="true">＋</span> 新建任务
        </button>
    </div>
</header>

<main class="page">
    <section class="stat-grid" aria-label="全局统计">
        <button class="stat-card is-active" type="button" data-status="ALL" aria-pressed="true" title="查看全部任务">
            <span class="stat-label">任务总数</span>
            <strong class="stat-value" id="statTotal">—</strong>
            <span class="stat-foot">全部外呼任务</span>
        </button>
        <button class="stat-card" type="button" data-status="PENDING" aria-pressed="false" title="只看待调度任务">
            <span class="stat-label">待调度</span>
            <strong class="stat-value" id="statPending">—</strong>
            <span class="stat-foot">等待计划时间到达</span>
        </button>
        <button class="stat-card" type="button" data-status="RUNNING" aria-pressed="false" title="只看进行中任务">
            <span class="stat-label">进行中</span>
            <strong class="stat-value" id="statRunning">—</strong>
            <span class="stat-foot">正在拨打的队列</span>
        </button>
        <article class="stat-card" aria-label="累计拨打量">
            <span class="stat-label">累计拨打量</span>
            <strong class="stat-value" id="statDialed">—</strong>
            <span class="stat-foot">单位：通</span>
        </article>
    </section>

    <section class="panel">
        <div class="toolbar">
            <div class="filter-group" role="group" aria-label="按状态筛选">
                <button class="chip is-active" type="button" data-status="ALL">全部</button>
                <button class="chip" type="button" data-status="PENDING">待调度</button>
                <button class="chip" type="button" data-status="RUNNING">进行中</button>
                <button class="chip" type="button" data-status="COMPLETED">已完成</button>
                <button class="chip" type="button" data-status="CANCELLED">已取消</button>
                <button class="chip" type="button" data-status="FAILED">已失败</button>
            </div>
            <span class="result-count" id="resultCount"></span>
        </div>

        <div class="banner" id="errorBanner" role="alert" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"
                 aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 7.5v5.5M12 16.2v.3"/>
            </svg>
            <span class="banner-text" id="errorText">数据加载失败</span>
            <button class="btn btn-small" id="retryBtn" type="button">重试</button>
        </div>

        <div class="table-wrap">
            <div class="skeleton" id="skeleton" aria-hidden="true">
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
            </div>

            <table class="task-table" id="taskTable" hidden>
                <thead>
                <tr>
                    <th scope="col">任务</th>
                    <th scope="col">状态</th>
                    <th scope="col" class="num">名单</th>
                    <th scope="col">拨打量</th>
                    <th scope="col" class="num">接通率</th>
                    <th scope="col" class="num">并发</th>
                    <th scope="col">计划开始</th>
                </tr>
                </thead>
                <tbody id="taskBody"></tbody>
            </table>

            <div class="empty" id="emptyGlobal" hidden>
                <svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor"
                     stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                    <rect x="7" y="13" width="34" height="26" rx="4"/>
                    <path d="M7 21h34M15 9v8M33 9v8"/>
                </svg>
                <h2>还没有外呼任务</h2>
                <p>创建一个任务，设定名单与计划时间，到点自动开始拨打。</p>
                <button class="btn btn-primary" type="button" id="emptyCreateBtn">新建任务</button>
            </div>

            <div class="empty" id="emptyFilter" hidden>
                <svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor"
                     stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                    <circle cx="21" cy="21" r="11"/>
                    <path d="m29 29 9 9"/>
                </svg>
                <h2>该状态下没有任务</h2>
                <p>当前筛选条件没有匹配的任务，可以切换状态或查看全部。</p>
                <button class="btn btn-ghost" type="button" id="clearFilterBtn">查看全部任务</button>
            </div>
        </div>
    </section>

    <p class="page-foot">数据每 10 秒自动刷新 · 演示数据，重启服务后重置</p>
</main>

<dialog class="modal" id="createDialog" aria-labelledby="dialogTitle">
    <form id="createForm" novalidate>
        <header class="modal-head">
            <h2 id="dialogTitle">新建外呼任务</h2>
            <button type="button" class="icon-btn" id="closeDialog" aria-label="关闭">×</button>
        </header>

        <div class="field">
            <label for="taskName">任务名称</label>
            <input id="taskName" name="name" maxlength="40" autocomplete="off" placeholder="例如：618 大促预热外呼">
            <p class="field-error" data-error-for="name"></p>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="contactCount">名单数量</label>
                <input id="contactCount" name="contactCount" type="number" min="1" max="5000" value="200"
                       inputmode="numeric">
                <p class="field-error" data-error-for="contactCount"></p>
            </div>
            <div class="field">
                <label for="concurrency">并发数</label>
                <input id="concurrency" name="concurrency" type="number" min="1" max="50" value="10"
                       inputmode="numeric">
                <p class="field-error" data-error-for="concurrency"></p>
            </div>
        </div>

        <div class="field">
            <label for="scheduledAt">计划开始时间</label>
            <input id="scheduledAt" name="scheduledAt" type="datetime-local" step="60">
            <p class="field-hint">到达时间后任务自动从「待调度」进入「进行中」</p>
            <p class="field-error" data-error-for="scheduledAt"></p>
        </div>

        <footer class="modal-foot">
            <button type="button" class="btn btn-ghost" id="cancelCreate">取消</button>
            <button type="submit" class="btn btn-primary" id="submitCreate">创建任务</button>
        </footer>
    </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
